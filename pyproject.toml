[project]
name = "o1fm"
version = "0.1.0"
description = "Continuous causal forecasting with O1 state and stored-compute Crystals."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "David Tom Foss"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.1",
]

[project.scripts]
o1fm = "o1fm.cli:main"

[project.urls]
Repository = "https://github.com/DT-Foss/o1fm"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
