[project]
name = "o1fm"
version = "0.1.0"
description = "Compact multivariate forecasting backbone with O1-style state-aware contracts."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
